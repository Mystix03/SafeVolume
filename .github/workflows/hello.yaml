
name: SafeVolume CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SafeVolume
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SafeVolume.sln

      - name: Build application
        run: dotnet build SafeVolume.sln --configuration Release --no-rest


        
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: SafeVolume-build
          path: SafeVolume/bin/Release/
          if-no-files-found: error
          retention-days: 7
