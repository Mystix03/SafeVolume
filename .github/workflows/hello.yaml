
name: SafeVolume CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SafeVolume
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET with NuGet caching
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: SafeVolume/SafeVolume.csproj

      - name: Restore dependencies
        run: dotnet restore SafeVolume.sln

      - name: Build application
        run: dotnet build SafeVolume.sln --configuration Release --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: SafeVolume-build
          path: SafeVolume/bin/Release/
          if-no-files-found: error
          retention-days: 7

      - name: Publish Windows application
        run: >
          dotnet publish SafeVolume/SafeVolume.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output ./publish

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: SafeVolume-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 7