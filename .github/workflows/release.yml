
name: SafeVolume Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release SafeVolume
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows application
        run: >
          dotnet publish SafeVolume/SafeVolume.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output ./publish

      - name: Package application
        run: Compress-Archive -Path ./publish/* -DestinationPath ./SafeVolume-win-x64.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ./SafeVolume-win-x64.zip `
            --title "SafeVolume ${{ github.ref_name }}" `
            --generate-notes
